[project]
name = "vibe-for-good-backend"
version = "0.1.0"
description = "Flask API for Vibe for Good 2026"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "python-dotenv>=1.0.1",
    # Adapts the WSGI app to API Gateway HTTP API payload format 2.0.
    "apig-wsgi>=2.19.0",
    # The Flask history adapter delegates clustering and deterministic
    # enrichment to data_pipeline; keep its runtime dependencies in the
    # deployed backend rather than copying those algorithms into Flask.
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "Pillow>=12.3.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0",
    "openmeteo-requests>=1.7.5",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
