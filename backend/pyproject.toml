[project]
name = "vibe-for-good-backend"
version = "0.1.0"
description = "Flask API for Vibe for Good 2026"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "python-dotenv>=1.0.1",
    # Adapts the WSGI app to API Gateway HTTP API payload format 2.0.
    "apig-wsgi>=2.19.0",
    # Used by the explicit Investigator/Skeptic action through Amazon Bedrock.
    "boto3>=1.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The Security workflow runs the flake8-bandit rules as their own invocation
# (`ruff check --select S`) so that one command also covers data_pipeline. A
# `# noqa: S310` therefore reads as unused under *this* config, and RUF100
# deletes the suppression and the reasoning next to it. Enabling the single
# bandit rule this package has to justify keeps the two runs agreeing.
extend-select = ["S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
